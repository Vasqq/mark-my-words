<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Perpl</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: day palette by default with a night switch. A centred sentence of coloured capsules sits above a rail of open positions and a 60fps chart card; every word opens an input + slider, lines drag, and each position has its own collateral, close and order controls. */
:root{--bg:#ece8e5;--fg:#141210;--fg2:#3d3833;--sub:#857e77;--line:rgba(20,18,16,.12);--panel:#fff;--glass:rgba(255,255,255,.82);--pop:#fff;--inset:#f3f0ed;--chip:#f0ece8;
  --lt:#a2e2c6;--ls:#fac1ac;--hfg:#141210;--gain:#1f9d63;--loss:#d4513a;--warn:#a96a08;--acc:#e0775a;--pcbg:rgba(255,255,255,.6);
  --gold:#eccd8d;--lav:#d7ceff;--coral:#fac1ac;--mint:#a2e2c6;--tgold:#b4862a;--tlav:#6d5ad6;--tmint:#1f8a5c;--tcoral:#cf5a3a;
  --msgbg:#fde9e3;--msgfg:#8c2c1b;
  --f:"Inter Tight",-apple-system,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:light}

*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:6px}
.app{position:relative;height:100%;display:flex;flex-direction:column}
.live{position:absolute;inset:0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.live canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.lv-h{position:absolute;left:calc(var(--xr) + 8px);top:0;margin-top:-16px;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;border-radius:16px;font-weight:700;font-size:13px;color:var(--hfg);cursor:ns-resize;touch-action:none;will-change:transform;white-space:nowrap;box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}
.lv-h.t{background:var(--lt)} .lv-h.s{background:var(--ls)}
.lv-h em{font-style:normal;font-weight:600;opacity:.7;font-size:12px}
.lv-h i{font-style:normal;opacity:.5;letter-spacing:-2px}
.lv-h:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.lv-pl{position:absolute;left:0;top:0;font-weight:700;font-size:13px;white-space:nowrap;pointer-events:none;will-change:transform}
.lv-pl.t{color:var(--lt)} .lv-pl.s{color:var(--ls)}
.lv-mark{position:absolute;left:calc(var(--nowx) + 12px);top:0;margin-top:-12px;height:24px;padding:0 8px;border-radius:7px;background:var(--fg);color:var(--bg);font-weight:700;font-size:12px;display:flex;align-items:center;pointer-events:none;will-change:transform}
.top{position:relative;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,3vw) 0}
.brand{font-weight:800;font-size:19px;letter-spacing:-.04em}.brand b{color:var(--acc)}
.bal{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}.bal small{color:var(--sub);font-weight:500}
.sim{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;padding:3px 8px;border-radius:999px;opacity:.85}
.head{position:relative;z-index:3;padding:18px max(16px,3vw) 0;pointer-events:none}
.head>*{pointer-events:auto}
.sentence{font-weight:700;letter-spacing:-.04em;line-height:1.36;margin:0}
.tk{display:inline-flex;align-items:center;gap:.16em;padding:0 .26em;border-radius:.26em;white-space:nowrap;transition:box-shadow .18s,background .2s,transform .1s;vertical-align:baseline}
.tk:active{transform:scale(.98)}
.tk .chev{width:.34em;height:.34em;opacity:.65;transition:transform .18s}
.tk.on .chev{transform:rotate(180deg)}
.tk.on,.tk:hover:not(.static){box-shadow:inset 0 0 0 1.5px currentColor}
.tk.bad{text-decoration:underline wavy var(--loss);text-decoration-thickness:.05em;text-underline-offset:.14em}
.tk svg.ar{width:.52em;height:.52em}
.tk .pc{font-style:normal;font-size:.4em;font-weight:700;letter-spacing:0;padding:.2em .5em;border-radius:999px;margin-left:.15em;background:var(--pcbg)}
.sub{margin:10px 0 0;font-size:13.5px;color:var(--sub)}
.msg{margin-top:12px;display:inline-flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--msgbg);color:var(--msgfg);font-size:14px;max-width:680px;flex-wrap:wrap}
.msg button{font-weight:700;padding:4px 10px;border-radius:999px;background:var(--fg);color:var(--bg);white-space:nowrap}
.done{margin-top:14px;max-width:560px;padding:16px 18px;border-radius:18px;background:var(--panel);font-size:15px;color:var(--fg2);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:6px;padding:6px;border-radius:22px;background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:inset 0 0 0 1px var(--line),0 20px 50px -20px rgba(0,0,0,.45);max-width:calc(100vw - 24px)}
.seg{display:flex;flex-direction:column;justify-content:center;padding:6px 14px;border-radius:16px;min-width:0}
.seg small{font-size:11px;color:var(--sub);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg b{font-size:15px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.g{color:var(--gain)} .r{color:var(--loss)}
.vsep{width:1px;height:30px;background:var(--line)}
.step{display:flex;align-items:center;gap:3px}
.step button{width:26px;height:26px;border-radius:50%;background:var(--chip);font-weight:700;line-height:1}
.step button.w{width:auto;padding:0 8px;border-radius:999px;font-size:12px}
.cta{height:48px;padding:0 22px;border-radius:16px;background:var(--fg);color:var(--bg);font-weight:800;font-size:15px;white-space:nowrap;transition:transform .1s,opacity .2s}
.cta:active{transform:scale(.98)} .cta[aria-disabled="true"]{opacity:.3;cursor:not-allowed}
.cta.red{background:var(--loss);color:#fff}
.ep{position:fixed;z-index:40;background:var(--pop);color:var(--fg);border-radius:20px;padding:14px;box-shadow:inset 0 0 0 1px var(--line),0 30px 60px -20px rgba(0,0,0,.5);animation:epin .18s cubic-bezier(.23,1,.32,1);transform-origin:var(--ox,20px) top}
@keyframes epin{from{opacity:0;transform:scale(.96)}}
.ep.sheet{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));top:auto;width:auto;border-radius:26px;padding:18px 16px}
.ep-bg{position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.35)}
.ep-x{position:absolute;right:12px;top:10px;height:30px;padding:0 12px;border-radius:999px;background:var(--chip);font-weight:700;font-size:13px}
.ep h4{margin:2px 4px 10px;font-size:13px;color:var(--sub);font-weight:600}
.numin{display:flex;align-items:baseline;gap:4px;background:var(--inset);border-radius:14px;padding:10px 12px;box-shadow:inset 0 0 0 1px transparent;cursor:text}
.numin:focus-within{box-shadow:inset 0 0 0 1.5px var(--fg)}
.numin span{font-size:26px;font-weight:700;color:var(--sub)}
.numin input{flex:1;min-width:0;width:100%;border:0;background:transparent;outline:none;font:inherit;font-size:26px;font-weight:700;letter-spacing:-.03em;color:var(--fg);padding:0}
.numin em{font-style:normal;font-size:11px;color:var(--sub);white-space:nowrap;align-self:center}
.ep-foot{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;font-size:11px;color:var(--sub);margin:8px 4px 0}
.ep-foot>span:nth-child(2){text-align:center}.ep-foot>span:last-child{text-align:right}
.ep-foot b{display:block;color:var(--fg);font-size:12.5px}
.ep-note{font-size:12px;color:var(--sub);margin:8px 4px 0}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;padding:11px 12px;border-radius:12px;text-align:left}
.mrow:hover{background:var(--inset)} .mrow[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.mrow b{font-size:16px;font-weight:800}
.sl{position:relative;height:42px;margin:10px 0 0;touch-action:pan-y;cursor:pointer;outline:none}
.sl:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:999px}
.sl-track{position:absolute;left:0;right:0;top:9px;height:26px;border-radius:999px;background:var(--inset);overflow:hidden}
.sl-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--c);min-width:26px}
.sl-thumb{position:absolute;top:22px;width:22px;height:22px;margin-left:-11px;transform:translateY(-50%);border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.sl-badge{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);padding:2px 7px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:11px;font-weight:700;white-space:nowrap}
.sl-mark{display:none}
.confirm{position:fixed;z-index:25;right:16px;transform:translateY(-50%);background:var(--pop);border-radius:14px;padding:10px;display:flex;gap:6px;align-items:center;box-shadow:inset 0 0 0 1px var(--line),0 20px 40px -10px rgba(0,0,0,.5);font-size:13px;flex-wrap:wrap;max-width:calc(100vw - 32px)}
.confirm b{margin:0 4px}
.drawer{position:fixed;z-index:30;top:12px;right:12px;bottom:12px;width:min(390px,calc(100vw - 24px));background:var(--pop);border-radius:26px;box-shadow:inset 0 0 0 1px var(--line),-30px 0 80px -20px rgba(0,0,0,.45);padding:22px;display:flex;flex-direction:column;gap:14px;overflow:auto;animation:din .28s cubic-bezier(.77,0,.175,1)}
@keyframes din{from{transform:translateX(30px);opacity:0}}
@media (max-width:640px){.drawer{top:auto;left:8px;right:8px;width:auto;max-height:86vh}}
.dh{display:flex;justify-content:space-between;align-items:center}
.drawer h2{margin:0;font-size:15px;color:var(--sub);font-weight:600;outline:none}
.drawer .re{font-size:23px;font-weight:700;letter-spacing:-.035em;line-height:1.25;margin:0}
.c-gold{color:var(--tgold)}.c-lav{color:var(--tlav)}.c-mint{color:var(--tmint)}.c-coral{color:var(--tcoral)}
.rows{display:flex;flex-direction:column}
.rows .r{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;color:inherit}
.rows .r:first-child{border-top:0}
.rows .k{color:var(--sub)} .rows .v{font-weight:600;text-align:right}
.rows .v small{display:block;color:var(--sub);font-weight:500;font-size:12px}
.rows .v.g{color:var(--gain)} .rows .v.r{color:var(--loss)}
.ack{display:flex;gap:12px;font-size:13px;color:var(--fg2);cursor:pointer;line-height:1.45}
.ack input{position:absolute;opacity:0;width:1px;height:1px}
.ack .box{width:22px;height:22px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;color:var(--bg)}
.ack input:checked+.box{background:var(--fg)}
.ack .box svg{width:12px;opacity:0}.ack input:checked+.box svg{opacity:1}
.ack input:focus-visible+.box{outline:2px solid var(--fg);outline-offset:2px}
.big{width:100%;height:52px;border-radius:16px;background:var(--fg);color:var(--bg);font-weight:800;font-size:15.5px}
.big[aria-disabled="true"]{opacity:.3;cursor:not-allowed}
.ghost{height:38px;padding:0 14px;border-radius:12px;background:var(--chip);font-weight:600;font-size:13.5px}
.ghost.solid{background:var(--fg);color:var(--bg)}
.fresh{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);font-weight:600}
.fresh svg{width:18px;height:18px;transform:rotate(-90deg)}.fresh circle{fill:none;stroke-width:2.5}.fresh .t{stroke:var(--line)}.fresh .p{stroke:var(--fg);transition:stroke-dashoffset .25s linear}
.steps{display:flex;flex-direction:column;gap:6px}
.st{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:9px 12px;border-radius:12px;background:var(--inset)}
.st i{width:16px;height:16px;border-radius:50%;flex:none;background:var(--sub);display:grid;place-items:center;font-style:normal;font-size:10px;color:var(--bg)}
.st.done i{background:var(--gain)}.st.run i{background:transparent;border:2px solid var(--fg);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.odo{display:inline-flex;white-space:nowrap}.odo-c{display:inline-block;height:1.08em;overflow:hidden;line-height:1.08em;vertical-align:top}.odo-s{display:flex;flex-direction:column;transition:transform .16s cubic-bezier(.23,1,.32,1)}.odo-s span{display:block;height:1.08em}.odo-x{display:inline-block;line-height:1.08em}
@media (max-width:640px){.bar{left:8px;right:8px;transform:none;max-width:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;border-radius:18px}.bar .vsep,.bar .hide-m{display:none}.seg{padding:4px 8px}.seg b{font-size:14px}.cta{grid-column:1/-1;height:44px}.step button{width:24px;height:24px}.lv-h{font-size:12px;padding:0 8px 0 10px}.lv-h em{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.top{order:0}.head{order:1;text-align:center;padding-top:26px;padding-bottom:18px}.chartbox{order:2}
.chartbox{position:relative;flex:1;min-height:320px;margin:0 max(16px,3vw) calc(96px + env(safe-area-inset-bottom,0px));border-radius:28px;background:#fff;box-shadow:0 1px 2px rgba(40,30,20,.06),0 24px 48px -28px rgba(40,30,20,.3);overflow:hidden}
.sentence{font-size:clamp(26px,3vw,40px);line-height:1.55}
.tk{padding:0 .36em;border-radius:999px;color:var(--fg);height:1.3em;vertical-align:.05em}
.tk.gold{background:var(--gold)}.tk.lav{background:var(--lav)}.tk.coral{background:var(--coral)}.tk.mint{background:var(--mint)}
.tk.stop{background:#fff;box-shadow:0 1px 2px rgba(40,30,20,.08),0 4px 12px -4px rgba(40,30,20,.15);color:var(--tcoral)}
.tk.on,.tk:hover:not(.static){box-shadow:0 0 0 1.5px var(--fg)}
.tail{color:var(--fg2)}
.msg{margin-left:auto;margin-right:auto}
.lv-mark{background:#141210;color:#fff}
.done{margin:14px auto 0}

:root[data-mode="night"]{--bg:#0b0c0f;--fg:#f3f1ee;--fg2:#d4d0cb;--sub:#8f8d8a;--line:rgba(255,255,255,.12);--panel:#16181e;--glass:rgba(22,24,30,.78);--pop:#16181e;--inset:rgba(255,255,255,.07);--chip:rgba(255,255,255,.08);
  --lt:#6fdcaa;--ls:#ff9b80;--hfg:#0b0c0f;--gain:#6fdcaa;--loss:#ff7a62;--warn:#e8b45a;--acc:#6fdcaa;--pcbg:rgba(255,255,255,.12);--card:#121419;
  --gold:#ecc97f;--lav:#b8acff;--coral:#ff9b80;--mint:#6fdcaa;--tgold:#ecc97f;--tlav:#b8acff;--tmint:#6fdcaa;--tcoral:#ff9b80;--msgbg:rgba(255,122,98,.12);--msgfg:#ffc2b5;color-scheme:dark}
:root{--card:#fff}
body{transition:background .35s}
.chartbox{background:var(--card)!important;transition:background .35s}
:root[data-mode="night"] .chartbox{box-shadow:inset 0 0 0 1px var(--line),0 24px 48px -28px rgba(0,0,0,.6)!important}
:root[data-mode="night"] .tk.gold{background:rgba(236,201,127,.14);color:var(--gold)}
:root[data-mode="night"] .tk.lav{background:rgba(184,172,255,.14);color:var(--lav)}
:root[data-mode="night"] .tk.coral{background:rgba(255,155,128,.14);color:var(--coral)}
:root[data-mode="night"] .tk.mint{background:rgba(111,220,170,.14);color:var(--mint)}
:root[data-mode="night"] .tk.stop{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,155,128,.45);color:var(--coral)}
:root[data-mode="night"] .tk.on,:root[data-mode="night"] .tk:hover:not(.static){box-shadow:inset 0 0 0 1.5px currentColor}
:root[data-mode="night"] .lv-mark{background:#f3f1ee;color:#0b0c0f}
.topr{display:flex;align-items:center;gap:8px}
.modebtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--glass);box-shadow:inset 0 0 0 1px var(--line);color:var(--fg);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.modebtn:active{transform:rotate(25deg) scale(.92)}
button.bal{height:38px;padding:0 6px 0 12px;border-radius:999px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--line)}
.bal .plus{width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700}
.sentence .br{display:block;height:0}
.sub.add{color:var(--tmint);font-weight:600}
.rail{order:2;display:flex;align-items:stretch;gap:8px;padding:0 max(16px,3vw) 12px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chartbox{order:3!important}
.pchip{flex:none;display:grid;grid-template-columns:auto auto;gap:2px 14px;align-items:center;text-align:left;padding:9px 14px 10px;border-radius:16px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--line);min-width:150px;transition:background .2s,box-shadow .2s,transform .15s}
.pchip:active{transform:scale(.98)}
.pchip[aria-selected="true"]{background:var(--fg);color:var(--bg);box-shadow:none}
.pchip[aria-selected="true"] .g{color:#8fe0b8}.pchip[aria-selected="true"] .r{color:#ffab98}
:root[data-mode="night"] .pchip[aria-selected="true"] .g{color:#137a4a}:root[data-mode="night"] .pchip[aria-selected="true"] .r{color:#c4432c}
.pc-t{display:flex;gap:8px;align-items:baseline}.pc-t b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.side{font-size:12px;font-weight:600;opacity:.75}
.pc-v{font-weight:700;font-size:15px;text-align:right}
.pc-bar{grid-column:1/-1;position:relative;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--ls),var(--line) 50%,var(--lt));margin-top:6px}
.pc-bar i{position:absolute;top:-3px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px var(--glass);transition:left .5s}
.pc-warn{grid-column:1/-1;font-size:11px;color:var(--warn);font-weight:600}
.pchip.new{display:flex;flex-direction:column;justify-content:center;gap:2px;background:transparent;box-shadow:inset 0 0 0 1.5px dashed var(--line);border:1.5px dashed var(--line);box-shadow:none}
.pchip.new b{font-size:14px}.pchip.new span{font-size:11.5px;color:var(--sub)}
.pchip.new[aria-selected="true"]{border-color:transparent;background:var(--fg);color:var(--bg)}
.pchip.new[aria-selected="true"] span{color:inherit;opacity:.7}
.rail-sum{margin-left:auto;align-self:center;font-size:13px;color:var(--sub);white-space:nowrap;padding-left:12px}
.rail-sum b{font-weight:700}
.seg.act{text-align:left;border-radius:16px;transition:background .2s}
.seg.act:hover{background:var(--chip)}
.seg .mini{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:12px;vertical-align:1px;margin-left:2px}
.tip{position:relative;display:inline-flex;align-items:center;gap:3px;cursor:help;outline:none}
.tip-i{display:inline-grid;place-items:center;width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px currentColor;font-size:8.5px;font-weight:800;opacity:.6}
.tip-b{position:absolute;bottom:calc(100% + 10px);left:-8px;width:240px;padding:10px 12px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:12.5px;font-weight:500;line-height:1.45;white-space:normal;opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .15s,transform .15s;z-index:50;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.tip:hover .tip-b,.tip:focus .tip-b{opacity:1;transform:none}
.simdock{position:absolute;z-index:4;top:12px;left:12px;display:flex;gap:4px;align-items:center;padding:4px 4px 4px 10px;border-radius:999px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--line);font-size:11.5px;color:var(--warn);font-weight:700;letter-spacing:.02em}
.simdock button{height:26px;padding:0 9px;border-radius:999px;background:var(--chip);color:var(--fg);font-size:12px;font-weight:600;letter-spacing:0}

// Smallest lot count n with d*q*(T-E(q)) >= G. Within one level gross is linear in q, so solve per level (non-monotone safe: first level that satisfies wins).
function solveSize(m,side,mark,T,G){
  const d=side==='long'?1:-1;const lv=side==='long'?book(m,mark).asks:book(m,mark).bids;
  let n0=0,C0=0;
  for(const [p,lots] of lv){
    const a=d>0?(T-p):(p-T); const q0=n0*m.lot; const b=d>0?(-C0+p*q0):(C0-p*q0);
    if(a>0){let need=(G-b)/a;let n=Math.max(n0+1,Math.ceil(need/m.lot-1e-9));if(n<=n0+lots){const q=n*m.lot;const E=(C0+p*(n-n0)*m.lot)/q;return {n,q,E,worst:p};}}
    C0+=p*lots*m.lot;n0+=lots;
  }
  return null;
}
function vwapFor(m,side,mark,n){const lv=side==='long'?book(m,mark).asks:book(m,mark).bids;let left=n,C=0,worst=0;for(const [p,lots] of lv){const t=Math.min(left,lots);C+=p*t*m.lot;left-=t;worst=p;if(!left)break;}if(left>0)return null;return {E:C/(n*m.lot),worst};}
function maxLotsForBudget(m,side,mark,L,budget){let lo=0,hi=0;const lv=side==='long'?book(m,mark).asks:book(m,mark).bids;for(const l of lv)hi+=l[1];
  const req=n=>{const v=vwapFor(m,side,mark,n);if(!v)return Infinity;const q=n*m.lot;return v.E*q/L+v.E*q*m.taker+topup(side,mark,v.E,q);};
  if(req(1)>budget)return 0;while(hi-lo>1){const mid=(lo+hi)>>1;if(req(mid)<=budget)lo=mid;else hi=mid;}return lo;}
function topup(side,M,E,q){const d=side==='long'?1:-1;return Math.max(0,-d*(M-E)*q);}
function liqPrice(side,E,q,C,mmr,F=0){const d=side==='long'?1:-1;const MMR=E*q*mmr;return Math.max(0,E+d*(MMR-C-F)/q);}
const stopBuffer=(m,mark)=>Math.max(m.tick,mark*.01);

function compute(dr,marks,free){
  const m=MK[dr.market];const M=marks[dr.market];const d=dr.side==='long'?1:-1;const L=dr.lev;
  const out={m,M,d,errors:{},ok:false};
  const ceil=Math.min(5,m.ceiling);out.ceil=ceil;
  if(!(L>=1&&L<=ceil+1e-9)) out.errors.lev=`Leverage must be between 1.00x and ${ceil.toFixed(2)}x.`;
  // target side validity vs mark (entry checked after solve)
  if(!(dr.target>0)) out.errors.target='Enter a positive price.';
  else if(d*(dr.target-M)<=0) out.errors.target=d>0?`A long target must be above the mark (${fmtP(M,m)}).`:`A short target must be below the mark (${fmtP(M,m)}).`;
  if(!(dr.goal>=.01)) out.errors.goal='Enter a goal of at least $0.01.';
  if(out.errors.target||out.errors.goal) return out;
  const s=solveSize(m,dr.side,M,dr.target,dr.goal);
  if(!s){out.errors.goal='This goal exceeds available depth at this target.';return out;}
  const {q,E,worst}=s;out.q=q;out.n=s.n;out.E=E;
  const bound=M*(1+d*BOUND);out.bound=fixP(roundTick(bound,m),m);
  if(d*(worst-bound)>0){out.errors.goal='Filling this size would move price past the 0.5% entry bound. Lower the goal or move the target further.';}
  if(d*(dr.target-E)<=0){out.errors.target=`Target must be beyond the estimated entry (${fmtP(E,m)}).`;}
  out.notional=E*q;out.margin=out.notional/L;out.entryFee=out.notional*m.taker;out.top=topup(dr.side,M,E,q);
  out.required=out.margin+out.entryFee+out.top;out.C=out.margin+out.top;
  out.gross=d*q*(dr.target-E);out.exitFeeT=dr.target*q*m.taker;out.netT=out.gross-out.entryFee-out.exitFeeT;
  out.liq=liqPrice(dr.side,E,q,out.C,m.mmr);out.buf=stopBuffer(m,M);
  // stop admission interval
  if(d>0){out.sLo=fixP(roundTick(Math.max(0,out.liq+out.buf)+m.tick,m),m);out.sHi=fixP(roundTick(Math.min(E,M)-m.tick,m),m);}
  else{out.sLo=fixP(roundTick(Math.max(E,M)+m.tick,m),m);out.sHi=fixP(roundTick(out.liq-out.buf-m.tick,m),m);}
  if(out.sLo>out.sHi) out.errors.stop='No safe stop at this leverage. Add budget or lower leverage.';
  else if(!(dr.stop>=out.sLo&&dr.stop<=out.sHi)) out.errors.stop=d>0?`Stop must be between ${fmtP(out.sLo,m)} and ${fmtP(out.sHi,m)} (below entry, above liquidation + buffer).`:`Stop must be between ${fmtP(out.sLo,m)} and ${fmtP(out.sHi,m)} (above entry, below liquidation − buffer).`;
  out.grossS=d*q*(dr.stop-E);out.netS=out.grossS-out.entryFee-dr.stop*q*m.taker;
  if(out.required>dr.budget+1e-9) out.errors.budget=`Needs ${fmtUsd(out.required)} but your budget is ${fmtUsd(dr.budget)}. Raise the budget or lower the goal.`;
  out.shortfall=Math.max(0,out.required-free);
  // feasible goal range at this target/budget/leverage
  const nMax=maxLotsForBudget(m,dr.side,M,L,dr.budget);
  if(nMax>0){const v=vwapFor(m,dr.side,M,nMax);out.gMax=Math.max(0,d*nMax*m.lot*(dr.target-v.E));}else out.gMax=0;
  out.reqGoalSize=dr.goal;out.overshoot=out.gross-dr.goal;
  out.ok=!Object.keys(out.errors).length;
  return out;
}

function fmtUsd(x,dp=2,sign=false){if(x==null||!isFinite(x))return '—';const a=Math.abs(x);let s;if(a>0&&a<.01&&dp>=2)s='<$0.01';else s='$'+a.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});if(x<0&&s!=='<$0.01')return '−'+s;if(sign&&x>0)return '+'+s;return s;}
const fmtShort=x=>Number.isInteger(Math.round(x*100)/100)&&Math.abs(x-Math.round(x))<1e-9?'$'+Math.round(x).toLocaleString('en-US'):fmtUsd(x);
function fmtP(p,m){if(p==null||!isFinite(p))return '—';return '$'+(+p).toLocaleString('en-US',{minimumFractionDigits:m.dp,maximumFractionDigits:m.dp});}
const fmtQ=(q,m)=>q==null||!isFinite(q)?'—':q.toFixed(m.qdp);
const fmtPct=x=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(1)+'%';
const ausd6=x=>x.toFixed(6)+' AUSD';
function parseNum(s){const t=String(s).replace(/[$,\s]/g,'');if(t===''||!/^\d*\.?\d*$/.test(t)||t==='.')return null;const v=parseFloat(t);return isFinite(v)?v:null;}

function Slider({value,min,max,step,onChange,onCommit,color,badge,label,valuetext,disabled,marks=[]}){
  const ref=useRef();const st=useRef({start:null,drag:false});const [drag,setDrag]=useState(false);
  const span=max-min||1;const pct=clamp((value-min)/span,0,1)*100;
  const fromX=x=>{const r=ref.current.getBoundingClientRect();let v=min+clamp((x-r.left)/r.width,0,1)*span;v=Math.round((v-min)/step)*step+min;return clamp(+v.toFixed(6),min,max);};
  const down=e=>{if(disabled||!e.isPrimary)return;e.preventDefault();ref.current.focus({preventScroll:true});st.current={start:value,drag:true};setDrag(true);ref.current.setPointerCapture&&ref.current.setPointerCapture(e.pointerId);onChange(fromX(e.clientX));};
  const move=e=>{if(st.current.drag&&e.isPrimary)onChange(fromX(e.clientX));};
  const up=e=>{if(!st.current.drag)return;st.current.drag=false;setDrag(false);onCommit&&onCommit();};
  const cancel=()=>{if(!st.current.drag)return;st.current.drag=false;setDrag(false);onChange(st.current.start);};
  const key=e=>{const k={ArrowRight:step,ArrowUp:step,ArrowLeft:-step,ArrowDown:-step,PageUp:step*10,PageDown:-step*10}[e.key];
    if(k!=null){e.preventDefault();onChange(clamp(+(value+k).toFixed(6),min,max));}else if(e.key==='Home'){e.preventDefault();onChange(min);}else if(e.key==='End'){e.preventDefault();onChange(max);}};
  return html`<div className=${'sl'+(drag?' drag':'')} ref=${ref} role="slider" tabIndex=${disabled?-1:0} aria-label=${label} aria-valuemin=${min} aria-valuemax=${max} aria-valuenow=${value} aria-valuetext=${valuetext} aria-disabled=${!!disabled}
    style=${{'--c':color}} onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${cancel} onKeyDown=${key} onKeyUp=${e=>{if(/Arrow|Page|Home|End/.test(e.key))onCommit&&onCommit();}}>
    <div className="sl-track"><div className="sl-fill" style=${{width:`calc(${pct}% + ${12-pct*.24}px)`}}></div>${marks.map((mk,i)=>html`<span key=${i} className="sl-mark" style=${{left:clamp((mk-min)/span,0,1)*100+'%'}}></span>`)}</div>
    <div className="sl-thumb" style=${{left:`calc(${pct}% + ${12-pct*.24}px)`}}>${badge&&html`<span className="sl-badge">${badge}</span>`}</div>
  </div>`;
}


/* ================= Shared hooks: simulated marks + simulator ================= */
function useMarks(){
  const [marks,setMarks]=useState({ETH:MK.ETH.mark0,BTC:MK.BTC.mark0});const runTo=useRef(null);
  useEffect(()=>{const r=rng(7);const id=setInterval(()=>{setMarks(mk=>{const out={...mk};for(const k of ['ETH','BTC']){const m=MK[k];let next=mk[k]*(1+(r()-.5)*.0006);
      if(runTo.current&&runTo.current.market===k){const g=runTo.current.price;next=mk[k]+(g-mk[k])*.35;if(Math.abs(g-next)<Math.max(m.tick*3,g*.0005))next=g;}
      out[k]=fixP(roundTick(next,m),m);}return out;});},reduce?1200:600);return ()=>clearInterval(id);},[]);
  return [marks,setMarks,runTo];
}
function useSim(marks,setMarks,runTo){
  const [ledger,setLedger]=useState({wallet:2000,free:1250,locked:0});
  const [pos,setPos]=useState(null);const [closed,setClosed]=useState(null);const [steps,setSteps]=useState(null);
  const posRef=useRef(null);posRef.current=pos;
  const settle=(exit,reason)=>{const p=posRef.current;if(!p)return;runTo.current=null;const m=MK[p.market];const d=p.side==='long'?1:-1;
    const gross=reason==='liquidated'?-p.C:d*p.q*(exit-p.E);const fee=reason==='liquidated'?0:exit*p.q*m.taker;
    const ret=reason==='liquidated'?0:p.C+gross-fee;
    setLedger(l=>({...l,locked:Math.max(0,l.locked-p.C),free:l.free+ret}));
    setClosed({...p,exit,gross,fees:p.entryFee+fee,net:reason==='liquidated'?-p.C-p.entryFee:gross-p.entryFee-fee,reason,
      label:{tp:'Take profit filled',sl:'Stop loss filled',liquidated:'Liquidated',manual:'Closed'}[reason]});
    setPos(null);};
  useEffect(()=>{const p=posRef.current;if(!p||p.status!=='active')return;const m=MK[p.market];const M=marks[p.market];const d=p.side==='long'?1:-1;
    if(p.tp.status==='registered'&&d*(M-p.tp.price)>=0){settle(p.tp.price,'tp');return;}
    if(p.sl.status==='registered'&&d*(M-p.sl.price)<=0){settle(fixP(roundTick(p.sl.price*(1-d*.0006),m),m),'sl');return;}
    const liq=liqPrice(p.side,p.E,p.q,p.C,m.mmr);if(d*(M-liq)<=0)settle(liq,'liquidated');},[marks]);
  const T=ms=>new Promise(r=>setTimeout(r,reduce?60:ms));
  const open=async(dr,q)=>{const m=MK[dr.market];const st=[{label:'Submitting bounded entry order',st:'run'},{label:'Acknowledged · awaiting fill',st:'wait'},{label:'Fill',st:'wait'},{label:'Take profit and stop loss',st:'wait'}];
    const up=(i,s,label)=>{st[i]={...st[i],st:s,label:label||st[i].label};setSteps([...st]);};setSteps([...st]);
    await T(650);up(0,'done');up(1,'run');await T(800);up(1,'done');
    const v=vwapFor(m,dr.side,marks[dr.market],q.n)||{E:q.E};const qq=q.n*m.lot;const C=v.E*qq/dr.lev+topup(dr.side,marks[dr.market],v.E,qq);const fee=v.E*qq*m.taker;
    up(2,'done',`Filled ${fmtQ(qq,m)} ${m.id} at ${fmtP(v.E,m)}`);setLedger(l=>({...l,free:l.free-C-fee,locked:l.locked+C}));
    setPos({market:dr.market,side:dr.side,q:qq,E:v.E,C,entryFee:fee,goal:dr.goal,target:dr.target,tp:{price:dr.target,status:'pending'},sl:{price:dr.stop,status:'pending'},status:'active',at:Date.now()});
    up(3,'run');await T(900);setPos(p=>p&&({...p,tp:{...p.tp,status:'registered'},sl:{...p.sl,status:'registered'}}));up(3,'done','TP and SL registered');await T(700);setSteps(null);};
  const close=async()=>{const p=posRef.current;if(!p)return;setPos(x=>({...x,status:'closing'}));await T(900);const m=MK[p.market];
    const v=vwapFor(m,p.side==='long'?'short':'long',marks[p.market],Math.round(p.q/m.lot))||{E:marks[p.market]};settle(v.E,'manual');};
  const amend=async(which,price)=>{setPos(p=>p&&({...p,[which]:{...p[which],status:'changing',next:price}}));await T(1000);setPos(p=>p&&({...p,[which]:{price:p[which].next,status:'registered'}}));};
  const nudge=a=>{const p=posRef.current;if(!p)return;const m=MK[p.market];
    if(a==='tp')runTo.current={market:p.market,price:p.tp.price+(p.side==='long'?m.tick:-m.tick)};
    else if(a==='sl')runTo.current={market:p.market,price:p.sl.price-(p.side==='long'?m.tick*4:-m.tick*4)};
    else{runTo.current=null;setMarks(mk=>({...mk,[p.market]:fixP(roundTick(mk[p.market]*(1+a),m),m)}));}};
  return {ledger,pos,closed,setClosed,steps,open,close,amend,nudge};
}
const pnlNow=(p,M)=>{const m=MK[p.market];const d=p.side==='long'?1:-1;const gross=d*p.q*(M-p.E);return {gross,net:gross-p.entryFee-M*p.q*m.taker};};

/* ================= LiveChart: 60fps canvas chart with draggable target/stop handles =================
   Canvas draws history, zones and lines every frame; the price eases toward each new tick and the
   series scrolls continuously between ticks. Handles are DOM (focusable, draggable) positioned per frame. */
function seedLive(id){const m=MK[id];const r=rng(m.seed*5+3);const n=160;const out=[];let v=m.mark0*(1-m.chg/100*.6);for(let i=0;i<n;i++){const t=i/(n-1);v+=((m.mark0*(1-m.chg/100*.6*(1-t)))-v)*.07+(r()-.5)*m.mark0*.0028;out.push(v);}out[n-1]=m.mark0;return out;}

  if(tf==='1W')return d.toLocaleString([], {weekday:'short',hour:'numeric'});return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});}
function LiveChart({market,mark,lv,pos,T:theme,onTarget,onStop,onAmend,layout,pnlAxis,tf='live'}){

/* ================= Privy (simulated) =================
   Mirrors the real integration:
   - PrivyProvider { loginMethods:['email','google','twitter','wallet'], appearance:{theme: day|night},
       embeddedWallets:{ ethereum:{ createOnLogin:'users-without-wallets' } }, defaultChain: monad }
   - useLogin().login()            -> lazy: only when the user takes an onchain action
   - useDepositFunds().depositFunds -> card / crypto transfer into the Privy wallet on Monad
   - useSendTransaction(tx,{uiOptions}) -> Privy confirmation modal, gas sponsored
   - signers (session signer + policy) -> "one-tap trading": no modal for in-policy actions
*/
const hex=n=>Array.from({length:n},()=>'0123456789abcdef'[Math.random()*16|0]).join('');
const short=a=>a.slice(0,6)+'…'+a.slice(-4);
const PERPL_EX='0x34b6c1e0f2a9d4c87b1e5f03a6d2c9e17b8f2e20';
const TAP_CAP=1000, TAP_HRS=24;

function usePrivy(){
  const [user,setUser]=useState(null);const [modal,setModal]=useState(null);const [oneTap,setOneTap]=useState(null);
  const uref=useRef(null);uref.current=user;const oref=useRef(null);oref.current=oneTap;
  const ask=(k,extra)=>new Promise(res=>setModal({k,...extra,resolve:v=>{setModal(null);res(v);}}));
  const login=()=>uref.current?Promise.resolve(true):ask('login');
  const fund=need=>ask('fund',{need});
  const tapOn=()=>{const o=oref.current;return !!(o&&o.until>Date.now());};
  const sign=req=>{if(req.tap&&tapOn()&&(req.amt||0)<=oref.current.cap&&uref.current&&uref.current.embedded)return Promise.resolve('tap');return ask('sign',{req});};
  const logout=()=>{setUser(null);setOneTap(null);};
  return {user,setUser,uref,modal,ask,login,fund,sign,oneTap,setOneTap,tapOn,logout};
}

        <input type="email" placeholder="your@email.com" aria-label="Email" value=${email} onInput=${e=>setEmail(e.target.value)}/><button type="submit" disabled=${!okEmail}>Submit</button></form>
      <button className="pv-opt" onClick=${()=>social('google','Google account')}>${GIcon}<span>Google</span></button>
      <button className="pv-opt" onClick=${()=>social('twitter','X account')}><span className="pv-x" aria-hidden="true">𝕏</span><span>X / Twitter</span></button>
      <button className="pv-opt" onClick=${()=>setSt({s:'wallets'})}><span className="pv-wi" aria-hidden="true"><svg viewBox="0 0 20 20" width="16" height="16"><rect x="2" y="5" width="16" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="14" cy="10.5" r="1.3" fill="currentColor"/></svg></span><span>Continue with a wallet</span><em>›</em></button>
      <p className="pv-fine">New here? Logging in creates a Monad wallet for you. No seed phrase, no extension.</p>`}
    ${st.s==='otp'&&html`<div className="pv-head"><span className="pv-badge">${html`<svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true"><rect x="2.5" y="4.5" width="15" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 6l6.5 5 6.5-5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`}</span><h3>Enter confirmation code</h3><p>Check <b>${email}</b> for an email from privy.io and enter the code below.</p></div>

    ${st.s==='wallets'&&html`<div className="pv-head"><h3>Connect a wallet</h3><p>Already on Monad? Use the wallet you have.</p></div>

/* ================= Multi-position simulator (one isolated position per market) ================= */
function useBook(marks,setMarks,runTo){
  const [ledger,setLedger]=useState({wallet:0,free:0,locked:0});
  const [book,setBook]=useState({});const [hist,setHist]=useState([]);const [result,setResult]=useState(null);const [toasts,setToasts]=useState([]);const [steps,setSteps]=useState(null);
  const ref=useRef(book);ref.current=book;const mref=useRef(marks);mref.current=marks;
  const toast=(t,kind='')=>{const id=Math.random();setToasts(x=>[...x.slice(-2),{id,t,kind}]);setTimeout(()=>setToasts(x=>x.filter(y=>y.id!==id)),5600);};
  const T=ms=>new Promise(r=>setTimeout(r,reduce?60:ms));
  const settle=(mk,exit,reason,frac=1)=>{const p=ref.current[mk];if(!p)return;if(runTo.current&&runTo.current.market===mk)runTo.current=null;const m=MK[mk];const d=p.side==='long'?1:-1;
    const qx=frac>=1?p.q:Math.round(p.q*frac/m.lot)*m.lot;const f=qx/p.q;const Cx=p.C*f,Fx=p.F*f,efx=p.entryFee*f;
    const gross=d*qx*(exit-p.E);const fee=reason==='liq'?0:exit*qx*m.taker;
    const ret=reason==='liq'?Math.max(0,Cx+gross+Fx)*.8:Cx+gross-fee+Fx;
    setLedger(l=>({...l,locked:Math.max(0,l.locked-Cx),free:l.free+ret}));
    const net=reason==='liq'?ret-Cx-efx:gross-fee-efx+Fx;
    setHist(h=>[{market:mk,side:p.side,q:qx,E:p.E,exit,gross,net,reason,at:Date.now()},...h].slice(0,20));
    setBook(b=>{const n={...b};if(f>=.9999)delete n[mk];else n[mk]={...p,q:p.q-qx,C:p.C-Cx,F:p.F-Fx,entryFee:p.entryFee-efx,status:'active'};return n;});
    const label={tp:`Take profit hit on ${mk}`,sl:`Stop hit on ${mk}`,liq:`${mk} position liquidated`,manual:f>=.9999?`Closed your ${mk} position`:`Closed ${fmtQ(qx,m)} ${mk}`}[reason];
    if(f>=.9999)setResult({market:mk,side:p.side,reason,exit,net,ret,E:p.E,tp:p.tp.price,sl:p.sl.price,at:Date.now()});
    else toast(html`<b>${label}</b> ${fmtUsd(net,2,true)} after fees`,net>=0?'g':'r');};
  useEffect(()=>{for(const mk of Object.keys(ref.current)){const p=ref.current[mk];if(p.status!=='active')continue;const m=MK[mk];const M=marks[mk];const d=p.side==='long'?1:-1;
      if(p.tp.status==='registered'&&d*(M-p.tp.price)>=0){settle(mk,p.tp.price,'tp');continue;}
      if(p.sl.status==='registered'&&d*(M-p.sl.price)<=0){settle(mk,fixP(roundTick(p.sl.price*(1-d*.0006),m),m),'sl');continue;}
      const liq=liqPrice(p.side,p.E,p.q,p.C,m.mmr,p.F);if(d*(M-liq)<=0)settle(mk,liq,'liq');}},[marks]);
  // funding accrues on every open position (sped up for the simulation)
  useEffect(()=>{const id=setInterval(()=>{setBook(b=>{const n={...b};for(const mk of Object.keys(n)){const p=n[mk];const m=MK[mk];const d=p.side==='long'?1:-1;n[mk]={...p,F:p.F-d*m.fund*mref.current[mk]*p.q,fEv:(p.fEv||0)+1};}return n;});},12000);return ()=>clearInterval(id);},[]);
  const open=async(dr,q)=>{setResult(r=>r&&r.market===dr.market?null:r);const m=MK[dr.market];const ex=ref.current[dr.market];const st=[{label:'Placing your order',st:'run'},{label:'Waiting for it to fill',st:'wait'},{label:'Filled',st:'wait'},{label:'Setting take profit and stop',st:'wait'}];
    const up=(i,s,label)=>{st[i]={...st[i],st:s,label:label||st[i].label};setSteps([...st]);};setSteps([...st]);
    await T(600);up(0,'done');up(1,'run');await T(700);up(1,'done');
    const v=vwapFor(m,dr.side,mref.current[dr.market],q.n)||{E:q.E};const qq=q.n*m.lot;const C=v.E*qq/dr.lev+topup(dr.side,mref.current[dr.market],v.E,qq);const fee=v.E*qq*m.taker;
    up(2,'done',`Filled ${fmtQ(qq,m)} ${m.id} at ${fmtP(v.E,m)}`);setLedger(l=>({...l,free:l.free-C-fee,locked:l.locked+C}));
    setBook(b=>{const p=b[dr.market];const base={market:dr.market,side:dr.side,tp:{price:dr.target,status:'pending'},sl:{price:dr.stop,status:'pending'},status:'active',at:Date.now()};
      if(p&&p.side===dr.side){const nq=p.q+qq;return {...b,[dr.market]:{...p,...base,q:nq,E:(p.E*p.q+v.E*qq)/nq,C:p.C+C,entryFee:p.entryFee+fee,goal:p.goal+dr.goal,lev:dr.lev,merged:true}};}
      return {...b,[dr.market]:{...base,q:qq,E:v.E,C,entryFee:fee,F:0,goal:dr.goal,lev:dr.lev}};});
    up(3,'run');await T(800);setBook(b=>b[dr.market]?{...b,[dr.market]:{...b[dr.market],tp:{...b[dr.market].tp,status:'registered'},sl:{...b[dr.market].sl,status:'registered'}}}:b);up(3,'done','Take profit and stop set');
    await T(500);setSteps(null);toast(html`<b>${ex?`Added to your ${m.id} position`:`You’re in: ${dr.side} ${fmtQ(qq,m)} ${m.id}`}</b> Take profit and stop are set.`,'g');};
  const close=async(mk,frac)=>{setBook(b=>({...b,[mk]:{...b[mk],status:'closing'}}));await T(800);const p=ref.current[mk];if(!p)return;const m=MK[mk];
    const lots=Math.round(p.q*frac/m.lot);const v=vwapFor(m,p.side==='long'?'short':'long',mref.current[mk],Math.max(1,lots))||{E:mref.current[mk]};settle(mk,v.E,'manual',frac);};
  const margin=async(mk,amt)=>{const p=ref.current[mk];if(!p)return;const m=MK[mk];setBook(b=>({...b,[mk]:{...b[mk],status:'margin'}}));await T(650);
    setLedger(l=>({...l,free:l.free-amt,locked:l.locked+amt}));setBook(b=>({...b,[mk]:{...b[mk],C:b[mk].C+amt,status:'active'}}));
    const nl=liqPrice(p.side,p.E,p.q,p.C+amt,m.mmr,p.F);toast(html`<b>Added ${fmtUsd(Math.abs(amt))} collateral to ${mk}</b> Liquidation moved to ${fmtP(nl,m)}`);};
  const amend=async(mk,which,price)=>{setBook(b=>b[mk]?{...b,[mk]:{...b[mk],[which]:{...b[mk][which],status:'changing',next:price}}}:b);await T(950);
    setBook(b=>b[mk]?{...b,[mk]:{...b[mk],[which]:{price:b[mk][which].next,status:'registered'}}}:b);toast(html`<b>${which==='tp'?'Take profit':'Stop'} on ${mk} moved</b> to ${fmtP(price,MK[mk])}`);};
  const nudge=(mk,a)=>{const p=ref.current[mk];const m=MK[mk];
    if(a==='tp'&&p)runTo.current={market:mk,price:p.tp.price+(p.side==='long'?m.tick:-m.tick)};
    else if(a==='sl'&&p)runTo.current={market:mk,price:p.sl.price-(p.side==='long'?m.tick*4:-m.tick*4)};
    else{runTo.current=null;setMarks(x=>({...x,[mk]:fixP(roundTick(x[mk]*(1+a),m),m)}));}};
  const move=async(kind,amt)=>{await T(500);if(kind==='deposit')setLedger(l=>({...l,wallet:l.wallet-amt,free:l.free+amt}));else setLedger(l=>({...l,wallet:l.wallet+amt,free:l.free-amt}));toast(html`<b>${kind==='deposit'?'Deposited':'Withdrew'} ${fmtUsd(amt)}</b> ${kind==='deposit'?'to your trading balance':'to your wallet'}`);};
  const credit=amt=>setLedger(l=>({...l,free:l.free+amt}));const reset=()=>{setLedger({wallet:0,free:0,locked:0});setBook({});setHist([]);setResult(null);};
  return {ledger,book,hist,toasts,steps,result,clearResult:()=>setResult(null),open,close,margin,amend,nudge,move,credit,reset,toast};
}

function CloseSheet({p,M,onDo,onClose}){
  const m=MK[p.market];const [pct,setPct]=useState(100);const d=p.side==='long'?1:-1;
  const lots=Math.round(p.q/m.lot);const n=pct===100?lots:Math.floor(lots*pct/100);const q=n*m.lot;
  const v=vwapFor(m,p.side==='long'?'short':'long',M,Math.max(1,n))||{E:M};const gross=d*q*(v.E-p.E);const fee=v.E*q*m.taker;const fr=q/p.q;

      ${positions.length===0&&!bk.result&&(authed?html`<span className="rail-empty">No active positions. Your positions will sit here.</span>`
        :html`<button className="rail-empty login-hint" onClick=${()=>px.login()}>Log in to view your active positions</button>`)}
      ${positions.length>0&&html`<span className="rail-sum">${positions.length} open · <b className=${totalNet>=0?'g':'r'}>${fmtUsd(totalNet,2,true)}</b></span>`}
    </div>`}

    <div className="chartbox" data-testid="chart"><div className="ctools">
        <div className="tfs" role="group" aria-label="Chart range">${Object.keys(TF).map(k=>html`<button key=${k} aria-pressed=${tf===k} onClick=${()=>setTf(k)}>${k==='live'?html`<i className="dot"></i>Live`:TF[k].label}</button>`)}</div>
        ${tf!=='live'&&html`<span className=${'tfchg '+(tfChange(market,tf)>=0?'g':'r')}>${pm.id} ${fmtPct(tfChange(market,tf))} <small>${tf==='1H'?'past hour':tf==='1D'?'24h':'7 days'}</small></span>`}
        ${pos&&html`<div className=${'simdock'+(demo?' open':'')} aria-label="Demo: move the price"><button className="dtog" aria-expanded=${demo} onClick=${()=>setDemo(!demo)}>Demo<span>: move price</span></button><span className="dbtns"><button onClick=${()=>bk.nudge(market,-.01)}>−1%</button><button onClick=${()=>bk.nudge(market,.01)}>+1%</button><button onClick=${()=>bk.nudge(market,'tp')}>Hit take profit</button><button onClick=${()=>bk.nudge(market,'sl')}>Hit stop</button></span></div>`}</div><${LiveChart} tf=${tf} market=${market} mark=${pM} lv=${lv} pos=${pos} T=${TH} layout=${(W,H)=>LAYOUT(W,H)} pnlAxis=${true}
      onTarget=${(v,drag)=>drag?setDragV({k:'T',v}):set({target:v})} onStop=${(v,drag)=>drag?setDragV({k:'S',v}):set({stop:v})} onAmend=${(k,v,y)=>{setDragV(null);setAmend({k,v,y,mk:market});}}/></div>

    ${!pos&&open==='goal'&&anchor&&html`<${EditPop} anchor=${anchor} onClose=${()=>setOpen(null)} label="Profit goal"><h4>How much do you want to make?</h4>
      <${NumIn} value=${draft.goal} label="Profit goal" onPreview=${v=>set({goal:Math.round(v*100)/100})} onCommit=${v=>set({goal:Math.max(1,Math.round(v*100)/100)})}/>
      <${Slider} value=${clamp(Math.round(draft.goal),1,Math.max(2,Math.floor(calc.gMax||1)))} min=${1} max=${Math.max(2,Math.floor(calc.gMax||1))} step=${1} color="var(--gold)" label="Profit goal" valuetext=${fmtShort(draft.goal)} onChange=${v=>set({goal:v})}/>
      <div className="ep-foot"><span><b>$1</b>min</span><span><b>${calc.required!=null?fmtUsd(calc.required):'—'}</b>collateral</span><span>${authed?html`<b>${fmtShort(Math.floor(calc.gMax||0))}</b>most with your funds`:''}</span></div><//>`}
    ${!pos&&open==='market'&&anchor&&html`<${EditPop} anchor=${anchor} onClose=${()=>setOpen(null)} label="Market"><h4>Choose a market</h4>
      ${['ETH','BTC'].map(id=>html`<button key=${id} className="mrow" role="option" aria-selected=${draft.market===id} onClick=${()=>pick(id)}><b>${id}</b><span>${fmtP(marks[id],MK[id])}${bk.book[id]?html` · <em>you’re ${bk.book[id].side}</em>`:''}</span><span className=${MK[id].chg>=0?'g':'r'}>${fmtPct(MK[id].chg)}</span></button>`)}<//>`}
    ${!pos&&open==='target'&&anchor&&html`<${EditPop} anchor=${anchor} onClose=${()=>{setOpen(null);setFrozen(null);}} label="Target price"><h4>${m.id} is ${fmtP(F.M,m)} now</h4>
      <${NumIn} value=${draft.target} label="Target price" dp=${m.dp} onPreview=${v=>set({target:v})} onCommit=${v=>set({target:fixP(roundTick(v,m),m)})}/>
      <${Slider} value=${clamp(tPct,tDom.lo,Math.max(tDom.hi,tPct))} min=${tDom.lo} max=${Math.max(tDom.hi,tPct)} step=${.1} color="var(--mint)" label="Distance from today’s price" valuetext=${fmtPct(tPct)} badge=${fmtPct(tPct)} onChange=${v=>set({target:fixP(roundTick(F.M*(1+v/100),m),m)})}/>
      <div className="ep-foot"><span><b>${fmtPct(tDom.lo)}</b>lowest</span><span><b className="g">${calc.q?fmtUsd(calc.netT,2,true):'—'}</b>you’d make, after fees</span><span><b>${fmtPct(Math.max(tDom.hi,tPct))}</b>highest</span></div>
      <//>`}
    ${!pos&&open==='stop'&&anchor&&html`<${EditPop} anchor=${anchor} onClose=${()=>{setOpen(null);setFrozen(null);}} label="Stop price"><h4>Stop loss</h4>
      <${NumIn} value=${draft.stop} label="Stop price" dp=${m.dp} onPreview=${v=>set({stop:v})} onCommit=${v=>set({stop:fixP(roundTick(v,m),m)})}/>
      ${sOK?html`<${Slider} value=${clamp(+((draft.stop/F.M-1)*100).toFixed(1),sDom.lo,sDom.hi)} min=${sDom.lo} max=${sDom.hi} step=${.1} color="var(--coral)" label="Distance from today’s price" valuetext=${fmtPct((draft.stop/F.M-1)*100)} badge=${fmtPct((draft.stop/F.M-1)*100)} onChange=${v=>set({stop:fixP(roundTick(F.M*(1+v/100),m),m)})}/>`:html`<p className="ep-note">There’s no safe stop at this leverage. Lower the leverage.</p>`}
      <div className="ep-foot"><span><b>${sOK?fmtP(F.sLo,m):'—'}</b>${d>0?'lowest safe stop':'closest'}</span><span><b className="r">${calc.netS!=null?fmtUsd(calc.netS):'—'}</b>you’d lose</span><span><b>${sOK?fmtP(F.sHi,m):'—'}</b>${d>0?'closest':'highest safe stop'}</span></div>
      <p className="ep-note">Closes at market when ${m.id} hits this price. The fill can be a little ${d>0?'lower':'higher'}.</p><//>`}
    ${pos&&(open==='tp'||open==='sl')&&anchor&&posPop(open)}

    <div className="bar" data-testid="bottom-bar" role="toolbar" aria-label=${pos?'Position controls':'Trade summary'}>
      ${pos?html`
        <div className="seg"><small>Position</small><b>${fmtQ(pos.q,pm)} ${pm.id}</b><small>${pos.side==='long'?'bought':'sold'} at ${fmtP(pos.E,pm)}</small></div><span className="vsep"></span>
        <button className="seg act" onClick=${()=>setSheet({k:'margin'})} aria-label="Add collateral"><small><${Tip} text=${GLOSS.collateral}>Collateral<//></small><b>${fmtUsd(pos.C)} <span className="mini">±</span></b><small>${(pos.E*pos.q/pos.C).toFixed(1)}x leverage</small></button><span className="vsep"></span>
        <div className="seg"><small><${Tip} text=${GLOSS.liq}>Liquidation<//></small><b>${fmtP(pliq,pm)}</b><small>${Math.abs((pliq/pM-1)*100).toFixed(0)}% away</small></div><span className="vsep hide-m"></span>
        <div className="seg hide-m"><small><${Tip} text=${GLOSS.funding}>Funding<//></small><b className=${pos.F>=0?'g':'r'}>${fmtUsd(pos.F,2,true)}</b><small>${pm.fund>0===(pos.side==='long')?'you pay':'you get'} ${perHour(Math.abs(pm.fund)*pM*pos.q)}</small></div><span className="vsep hide-m"></span>
        <div className="seg hide-m"><small>If you close now</small><b className=${live.net+pos.F>=0?'g':'r'}><${Odo} text=${fmtUsd(live.net+pos.F,2,true)}/></b><small>after fees</small></div>
        <button className="cta red" onClick=${()=>setSheet({k:'close'})} aria-disabled=${pos.status!=='active'}>Close</button>`
      :html`
        <div className="seg"><small>${d>0?'Long':'Short'}</small><b>${calc.q?fmtQ(calc.q,m)+' '+m.id:'—'}</b></div><span className="vsep"></span>
        <div className="seg"><small><${Tip} text=${GLOSS.collateral}>Collateral<//></small><b><${Odo} text=${calc.required!=null?fmtUsd(calc.required):'—'}/></b></div><span className="vsep"></span>
        <div className="seg"><small><${Tip} text=${GLOSS.lev}>Leverage<//></small><span className="step"><button aria-label="Lower leverage" onClick=${()=>set({lev:Math.max(1,+(draft.lev-.5).toFixed(2))})}>−</button><b style=${{minWidth:'44px',textAlign:'center'}}>${draft.lev.toFixed(1)}x</b><button aria-label="Raise leverage" onClick=${()=>set({lev:Math.min(5,+(draft.lev+.5).toFixed(2))})}>+</button></span></div><span className="vsep hide-m"></span>
        <div className="seg hide-m"><small><${Tip} text=${GLOSS.liq}>Liquidation<//></small><b>${calc.liq?fmtP(calc.liq,m):'—'}</b></div><span className="vsep hide-m"></span>
        <div className="seg hide-m"><small>If stopped</small><b className="r">${calc.netS!=null?fmtUsd(calc.netS):'—'}</b></div>
        <button className="cta" aria-disabled=${!canReview} onClick=${startReview}>${adding?'Review add':'Review'}</button>`}
    </div>

    ${amend&&pos&&html`<div className="confirm" style=${{top:clamp(amend.y,80,innerHeight-80)+'px'}} role="dialog" aria-label="Confirm order change">
      Move ${amend.k==='tp'?'take profit':'stop'} to <b>${fmtP(amend.v,pm)}</b>?<button className="ghost solid" onClick=${async()=>{const a=amend;setAmend(null);if(await gate(amendReq(pos,a.k,a.v)))bk.amend(a.mk,a.k,a.v);}}>Save</button><button className="ghost" onClick=${()=>setAmend(null)}>Cancel</button></div>`}

    ${review&&html`<aside className="drawer" role="dialog" aria-modal="true" aria-labelledby="rv-h" onKeyDown=${e=>{if(e.key==='Escape'&&!bk.steps)setReview(null);}}>
      <div className="dh"><h2 id="rv-h" tabIndex="-1" ref=${drawerH}>${adding?'Add to your position':'Your trade plan'}</h2>
        ${stale?html`<button className="ghost" onClick=${startReview}>Prices moved · Refresh</button>`:html`<span className="fresh"><svg viewBox="0 0 20 20"><circle className="t" cx="10" cy="10" r="8"/><circle className="p" cx="10" cy="10" r="8" strokeDasharray="50.27" strokeDashoffset=${50.27*(age/QUOTE_LIFE)}/></svg>${Math.max(0,Math.ceil(QUOTE_LIFE-age))}s</span>`}</div>
      <p className="re">Make <span className="c-gold">${fmtShort(review.draft.goal)}</span> if <span className="c-lav">${m.id}</span> ${d>0?'rises':'falls'} to <span className="c-mint">${fmtP(review.draft.target,m)}</span>, stop at <span className="c-coral">${fmtP(review.draft.stop,m)}</span>.</p>
      ${adding&&html`<p className="ep-note" style=${{margin:0}}>Perpl combines this with your ${fmtQ(ex.q,m)} ${m.id} ${ex.side}. The new take profit and stop apply to the whole position.</p>`}
      <div className="rows">
        <div className="r"><span className="k">${d>0?'You buy':'You sell'}</span><span className="v">${fmtQ(review.q,m)} ${m.id}<small>at about ${fmtP(review.E,m)}</small></span></div>
        <div className="r"><span className="k">Collateral</span><span className="v">${fmtUsd(review.required)}<small>${review.draft.lev.toFixed(1)}x leverage</small></span></div>
        <div className="r"><span className="k">If ${m.id} hits ${fmtP(review.draft.target,m).replace(/\.0+$/,'')}</span><span className="v g">${fmtUsd(review.netT,2,true)}<small>after fees</small></span></div>
        <div className="r"><span className="k">If stopped</span><span className="v r">${fmtUsd(review.netS)}<small>can be a bit worse in fast markets</small></span></div>
        <div className="r"><span className="k">Liquidation</span><span className="v">${fmtP(review.liq,m)}<small>${Math.abs((review.liq/review.M-1)*100).toFixed(0)}% ${d>0?'below':'above'} today’s price</small></span></div>
      </div>
      <details className="more"><summary>Details</summary><div className="rows">
        <div className="r"><span className="k">Position size</span><span className="v">${fmtUsd(review.notional)}</span></div>
        <div className="r"><span className="k">Worst entry price</span><span className="v">${fmtP(review.bound,m)}<small>the order won’t fill beyond this</small></span></div>
        <div className="r"><span className="k">Fee to open</span><span className="v">${fmtUsd(review.entryFee)}</span></div>
        <div className="r"><span className="k">Funding</span><span className="v">${m.fund>0===(d>0)?'you pay':'you get'} ${perHour(Math.abs(m.fund)*review.M*review.q)}</span></div>
      </div></details>
      ${bk.steps?html`<div className="steps" role="status">${bk.steps.map((s,i)=>html`<div key=${i} className=${'st '+s.st}><i>${s.st==='done'?'✓':''}</i>${s.label}</div>`)}</div>`:html`
        <label className="ack"><input type="checkbox" checked=${ack} onChange=${e=>setAck(e.target.checked)}/><span className="box"><svg viewBox="0 0 12 10"><path d="M1 5l3.5 3.5L11 1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>I understand I could lose up to my collateral.</span></label>
        <button className="big" aria-disabled=${!ack||stale||busyOpen} onClick=${async()=>{if(!ack||stale||busyOpen)return;const rv=review;const mk=rv.draft.market;setBusyOpen(true);
          const ok=await gate({title:`${adding?'Add to':'Open'} ${mk} ${rv.draft.side}`,desc:`Make ${fmtShort(rv.draft.goal)} if ${mk} ${rv.draft.side==='long'?'rises':'falls'} to ${fmtP(rv.draft.target,MK[mk])}.`,fn:'execOrder + TP/SL',tap:true,amt:rv.required,
            rows:[['Size',`${fmtQ(rv.q,MK[mk])} ${mk}`],['Collateral',fmtUsd(rv.required)],['Take profit · stop',`${fmtP(rv.draft.target,MK[mk])} · ${fmtP(rv.draft.stop,MK[mk])}`]]},rv.required+rv.entryFee);
          setBusyOpen(false);setQAt(Date.now());if(!ok)return;await bk.open(rv.draft,rv);setReview(null);setSel(mk);}}>${!authed?'Log in and open':adding?'Add to position':'Open position'}</button>
        ${!authed&&html`<p className="ep-note" style=${{margin:0,textAlign:'center'}}>Log in with email, Google or a wallet. New accounts get a Monad wallet automatically.</p>`}
        <button className="ghost" onClick=${()=>setReview(null)}>Back to the chart</button>`}
    </aside>`}

    ${sheet&&sheet.k==='margin'&&pos&&html`<${CollateralSheet} p=${pos} M=${pM} free=${bk.ledger.free} onDo=${async a=>{const p=pos;if(await gate({title:`${a>=0?'Add':'Remove'} ${fmtUsd(Math.abs(a))} collateral`,desc:`${p.market} ${p.side}`,fn:a>=0?'increasePositionCollateral':'decreasePositionCollateral',tap:true,amt:Math.max(0,a),rows:[['Collateral',`${fmtUsd(p.C)} → ${fmtUsd(p.C+a)}`]]}))bk.margin(p.market,a);}} onClose=${()=>setSheet(null)}/>`}
    ${sheet&&sheet.k==='close'&&pos&&html`<${CloseSheet} p=${pos} M=${pM} onDo=${async f=>{const p=pos;if(await gate({title:`Close ${f>=1?'':Math.round(f*100)+'% of '}${p.market} ${p.side}`,desc:'Closes at the current market price.',fn:'execOrder (reduce-only)',tap:true,rows:[['Quantity',`${fmtQ(f>=1?p.q:p.q*f,MK[p.market])} ${p.market}`]]}))bk.close(p.market,f);}} onClose=${()=>setSheet(null)}/>`}
    ${sheet&&sheet.k==='account'&&authed&&html`<${AccountSheet} bk=${bk} marks=${marks} px=${px} gate=${gate} openTap=${()=>setSheet(null)||setTapOffer(true)} onClose=${()=>setSheet(null)}/>`}
    ${tapOffer&&html`<${OneTapSheet} px=${px} toast=${bk.toast} onClose=${()=>setTapOffer(false)}/>`}
    ${tapBanner&&!tapOffer&&!sheet&&!review&&!px.modal&&!px.tapOn()&&html`<div className="tapban" role="status"><span className="bolt">${Bolt}</span><span>Trade without the pop-up for 24 hours?<small>Only on Perpl, up to $1,000 per trade.</small></span><button className="ghost solid" onClick=${()=>{setTapBanner(false);setTapOffer(true);}}>Turn on</button><button className="x" aria-label="Not now" onClick=${()=>setTapBanner(false)}>×</button></div>`}
    <${PrivyLayer} px=${px} onCredit=${bk.credit}/>
    <div className="toasts" aria-live="polite" hidden=${!!(sheet||review||px.modal||tapOffer||tapBanner)}>${bk.toasts.map(t=>html`<div key=${t.id} className=${'toast '+t.kind}>${t.t}</div>`)}</div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>

</body></html>
